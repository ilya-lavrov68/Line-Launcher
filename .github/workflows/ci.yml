name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  # Manual re-run. Needed because a run whose jobs never started (a billing
  # block, an outage) cannot be re-run from the UI — GitHub refuses with
  # "its workflow file may be broken" — and a re-push to get CI going is noise
  # in the history.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    # Windows is included deliberately: the brand generator, the doctor and the
    # dev wrapper all failed there while a Linux-only job stayed green.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tauri crate and npm API are on the same minor
        run: npm run check:tauri
      - name: Branding is up to date
        run: npm run brand:check
      - name: Unit tests
        shell: bash
        # The tail of the run goes into an annotation, because the raw job log
        # sits behind a host that some environments cannot reach. Without this
        # the only thing visible from outside is "exit code 1".
        run: |
          set -o pipefail
          if ! npm test 2>&1 | tee frontend-test.log; then
            message=$(tail -c 4000 frontend-test.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=npm test failed::${message}"
            exit 1
          fi
      - run: npm run build
      - name: Icon generation runs from a clean stamp
        # Exercises the `tauri icon` spawn, which is where `npx.cmd` threw
        # EINVAL on Windows, then re-checks that the stamp was written.
        # (icon.icns is not byte-reproducible, so git cleanliness is not asserted.)
        run: |
          set -o pipefail
          rm -f src-tauri/icons/.brand-source.sha256
          if ! npm run brand 2>&1 | tee brand-regen.log; then
            message=$(tail -c 2500 brand-regen.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=icon generation failed::${message}"
            exit 1
          fi
          npm run brand:check
      - name: Doctor and dev wrapper are runnable
        run: |
          npm run doctor -- --frontend-only
          npm run tauri -- --version

  ui-smoke:
    # The browser suites need a real Chromium and a running dev server, so they
    # cannot live in the frontend job. test:boot guards the single-connect
    # startup invariant (a StrictMode double-fetch was found this way).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright-core install --with-deps chromium
      - name: Dev server
        run: npm run dev &
      - name: Wait for Vite
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 2
          done
          echo "dev server did not start" >&2
          exit 1
      - name: Boot smoke
        shell: bash
        run: |
          set -o pipefail
          if ! npm run test:boot 2>&1 | tee boot-smoke.log; then
            message=$(tail -c 4000 boot-smoke.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=test:boot failed::${message}"
            exit 1
          fi
      - name: Browser suites
        shell: bash
        run: |
          set -o pipefail
          if ! npm run test:ui 2>&1 | tee browser-suites.log; then
            message=$(tail -c 4000 browser-suites.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=test:ui failed::${message}"
            exit 1
          fi

  rust-pure:
    # Runs the dependency-free Rust logic with plain rustc. This is a fast
    # smoke signal, NOT a replacement for the full `rust` job below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Pure Rust logic
        shell: bash
        run: |
          set -o pipefail
          if ! npm run test:rust 2>&1 | tee rust-pure.log; then
            message=$(tail -c 4000 rust-pure.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=test:rust failed::${message}"
            exit 1
          fi

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Lockfile is current
        shell: bash
        # This is the step the three rust jobs died on. `cargo metadata` exits
        # 101 when Cargo.toml and Cargo.lock disagree, and says which crate in
        # a message that used to be thrown away by `> /dev/null`.
        run: |
          set -o pipefail
          if ! cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null 2> lock.log; then
            message=$(tail -c 4000 lock.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=cargo metadata --locked failed (Cargo.lock is stale)::${message}"
            exit 1
          fi
      - name: Format
        shell: bash
        run: |
          set -o pipefail
          if ! cargo fmt --manifest-path src-tauri/Cargo.toml --check 2>&1 | tee fmt.log; then
            message=$(tail -c 4000 fmt.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=cargo fmt failed (run: cargo fmt)::${message}"
            exit 1
          fi
      # Compiler diagnostics are echoed as annotations so a failure is readable
      # in the PR UI without downloading the raw job log.
      - name: Check all targets
        shell: bash
        run: |
          set -o pipefail
          if ! cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets --message-format short 2>&1 | tee cargo-check.log; then
            message=$(tail -c 3000 cargo-check.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=cargo check failed::${message}"
            exit 1
          fi
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee cargo-test.log; then
            message=$(tail -c 3000 cargo-test.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=cargo test failed::${message}"
            exit 1
          fi
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          if ! cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --message-format short -- -D warnings 2>&1 | tee cargo-clippy.log; then
            message=$(tail -c 3000 cargo-clippy.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=cargo clippy failed::${message}"
            exit 1
          fi

  java-client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Reference Java client / one-shot exchange integration
        shell: bash
        run: |
          set -o pipefail
          if ! npm run test:java 2>&1 | tee java-test.log; then
            message=$(tail -c 2500 java-test.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=test:java failed::${message}"
            exit 1
          fi
      - name: Reference provider / pack / demo-game end-to-end
        shell: bash
        run: |
          set -o pipefail
          if ! npm run test:provider 2>&1 | tee provider-test.log; then
            message=$(tail -c 2500 provider-test.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=test:provider failed::${message}"
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          VERSION=8.28.0
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Secret scan
        shell: bash
        # `--redact` hides the secret but keeps the rule, file and line, which
        # is what identifies a false positive. Wrapped so the finding reaches
        # an annotation instead of only the job log.
        run: |
          set -o pipefail
          if ! gitleaks detect --verbose --redact 2>&1 | tee gitleaks.log; then
            message=$(tail -c 4000 gitleaks.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=gitleaks found something::${message}"
            exit 1
          fi
