[package]
name = "line-launcher"
version = "0.1.0"
description = "Line Launcher by Plus In Plus — provider-configured Minecraft launcher"
authors = ["Plus In Plus"]
edition = "2021"
rust-version = "1.95"
license-file = "../LICENSE"

[lib]
name = "line_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pinned to a minor on purpose: the Tauri CLI requires the `tauri` crate and
# `@tauri-apps/api` to share major.minor. A bare "2" lets cargo float to a newer
# minor than the npm lockfile and breaks `tauri dev`/`build`. Bump both together;
# `npm run doctor` and CI check the pair.
tauri = { version = "~2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1.52.3", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
url = "2.5"
semver = "1.0"
sha2 = "0.10"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tempfile = "3.27"
sysinfo = { version = "0.39.5", default-features = false, features = ["disk", "system"] }
uuid = { version = "1.11", features = ["v4"] }
zeroize = "1.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Pipes", "Win32_System_Threading"] }
