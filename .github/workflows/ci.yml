name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Branding is up to date
        run: npm run brand:check
      - run: npm test
      - run: npm run build

  rust-pure:
    # Runs the dependency-free Rust logic with plain rustc. This is a fast
    # smoke signal, NOT a replacement for the full `rust` job below.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: npm run test:rust

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Lockfile is current
        shell: bash
        run: cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml > /dev/null
      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      # Compiler diagnostics are echoed as annotations so a failure is readable
      # in the PR UI without downloading the raw job log.
      - name: Check all targets
        shell: bash
        run: |
          set -o pipefail
          if ! cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets --message-format short 2>&1 | tee cargo-check.log; then
            message=$(tail -c 3000 cargo-check.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=cargo check failed::${message}"
            exit 1
          fi
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          if ! cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee cargo-test.log; then
            message=$(tail -c 3000 cargo-test.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=cargo test failed::${message}"
            exit 1
          fi
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          if ! cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --message-format short -- -D warnings 2>&1 | tee cargo-clippy.log; then
            message=$(tail -c 3000 cargo-clippy.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=cargo clippy failed::${message}"
            exit 1
          fi

  java-client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Reference Java client / one-shot exchange integration
        run: npm run test:java
      - name: Reference provider / pack / demo-game end-to-end
        shell: bash
        run: |
          set -o pipefail
          if ! npm run test:provider 2>&1 | tee provider-test.log; then
            message=$(tail -c 2500 provider-test.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=test:provider failed::${message}"
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          VERSION=8.28.0
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz -C /tmp
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - run: gitleaks detect --verbose --redact
